<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Isometric 2.5D — Setup Demo</title>
<style>
  :root { --bg:#080102; --crimson:#FF2D2A; --white:#F5F2EC; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:var(--bg); height:100%; overflow:hidden; font-family:'DM Sans',system-ui,sans-serif; }
  #app { position:fixed; inset:0; }
  .hint {
    position:fixed; left:1.5rem; bottom:1.5rem; z-index:10; color:var(--white);
    font-size:.8rem; letter-spacing:.05em; line-height:1.6; opacity:.7;
    background:rgba(255,45,42,.08); border:1px solid rgba(255,45,42,.25);
    padding:.9rem 1.2rem; border-radius:6px; backdrop-filter:blur(8px);
  }
  .hint b { color:var(--crimson); letter-spacing:.2em; text-transform:uppercase; font-size:.7rem; }
  kbd { background:rgba(255,45,42,.15); border:1px solid rgba(255,45,42,.4); border-radius:3px; padding:1px 6px; font-size:.72rem; }
</style>
</head>
<body>
<canvas id="app"></canvas>
<div class="hint">
  <b>Isometric 2.5D</b><br>
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> &nbsp;gerak (screen-relative)
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
 * 1. SCENE + RENDERER
 * =================================================================== */
const canvas = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;                 // aktifkan bayangan
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x080102, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x080102, 0.012);    // haze gelap

/* =====================================================================
 * 2. KAMERA ISOMETRIK (OrthographicCamera)
 *    - Tanpa distorsi perspektif.
 *    - Top-down angled: Pitch 35.264°, Yaw 45°.
 * =================================================================== */
const YAW   = Math.PI / 4;                          // 45°
const PITCH = Math.atan(Math.sin(Math.PI / 4));     // ≈ 35.264°  (atan(1/√2))
const DIST  = 60;                                   // jarak kamera dari pusat
const FRUSTUM = 24;                                 // "zoom" — makin kecil makin dekat

function makeOrthoCamera() {
  const aspect = innerWidth / innerHeight;
  const cam = new THREE.OrthographicCamera(
    -FRUSTUM * aspect / 2,  FRUSTUM * aspect / 2,    // left, right
     FRUSTUM / 2,          -FRUSTUM / 2,             // top, bottom
    -200, 500                                        // near (boleh negatif utk ortho), far
  );
  // Posisi dari pitch + yaw. Hasilnya setara (d, d, d) — sudut iso klasik.
  cam.position.set(
    DIST * Math.cos(PITCH) * Math.sin(YAW),
    DIST * Math.sin(PITCH),
    DIST * Math.cos(PITCH) * Math.cos(YAW)
  );
  cam.lookAt(0, 0, 0);                               // selalu menghadap pusat map
  return cam;
}
let camera = makeOrthoCamera();

/* =====================================================================
 * 3. PENCAHAYAAN — vibe cyberpunk hitam/merah
 * =================================================================== */
// Ambient redup ber-tint merah gelap → kesan space
scene.add(new THREE.AmbientLight(0x2a0606, 0.6));

// Key light merah neon intens dari atas-serong → shadow & highlight kuat
const keyLight = new THREE.DirectionalLight(0xFF2D2A, 2.6);
keyLight.position.set(18, 30, 14);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
const s = keyLight.shadow.camera;                   // bound shadow frustum (ortho light)
s.left = -40; s.right = 40; s.top = 40; s.bottom = -40; s.near = 1; s.far = 120;
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

// Fill point light merah dari sisi berlawanan → rim glow
const fillLight = new THREE.PointLight(0xFF4F4C, 1.4, 90);
fillLight.position.set(-22, 16, -10);
scene.add(fillLight);

// Sedikit cool counter-light biar tidak flat
const cool = new THREE.PointLight(0x331018, 0.6, 70);
cool.position.set(10, 8, -20);
scene.add(cool);

/* =====================================================================
 * 4. WORLD — ground grid + beberapa "bangunan"
 *    (Sumbu X & Z = bidang lantai, Y = tinggi bangunan)
 * =================================================================== */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshStandardMaterial({ color: 0x0a0102, metalness: 0.9, roughness: 0.35 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(80, 40, 0xFF2D2A, 0x3a0a0a);
grid.material.opacity = 0.25; grid.material.transparent = true;
scene.add(grid);

// Bangunan acak (boxes dengan tinggi berbeda di sumbu Y)
function building(x, z, h, color) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(3, h, 3),
    new THREE.MeshStandardMaterial({ color, metalness: 0.5, roughness: 0.25, emissive: 0x1a0202, emissiveIntensity: 0.5 })
  );
  m.position.set(x, h / 2, z);                      // Y = setengah tinggi → alas di lantai
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  // edge glow strip
  const strip = new THREE.Mesh(
    new THREE.BoxGeometry(3.05, 0.08, 3.05),
    new THREE.MeshBasicMaterial({ color: 0xFF2D2A })
  );
  strip.position.set(x, h, z);
  scene.add(strip);
}
building(-9, -6, 6, 0x120306);
building(-3,  8, 9, 0x0d0205);
building( 7,  4, 4, 0x150307);
building( 10, -8, 7, 0x0d0205);
building(-12, 5, 5, 0x120306);

/* =====================================================================
 * 5. PLAYER — bidang gerak di X/Z, Y = tinggi karakter
 * =================================================================== */
const player = new THREE.Mesh(
  new THREE.BoxGeometry(1.6, 2.2, 1.6),
  new THREE.MeshStandardMaterial({ color: 0xFF2D2A, emissive: 0xFF2D2A, emissiveIntensity: 0.6, metalness: 0.3, roughness: 0.4 })
);
player.position.set(0, 1.1, 0);
player.castShadow = true;
scene.add(player);

// glow ring di bawah player
const ring = new THREE.Mesh(
  new THREE.RingGeometry(1.2, 1.6, 32),
  new THREE.MeshBasicMaterial({ color: 0xFF2D2A, transparent: true, opacity: 0.5, side: THREE.DoubleSide })
);
ring.rotation.x = -Math.PI / 2; ring.position.y = 0.02;
scene.add(ring);

/* =====================================================================
 * 6. MOVEMENT — dipetakan ke sudut kamera iso (screen-relative)
 *    Arah layar diputar 45° agar selaras dengan yaw kamera:
 *      Up    (layar atas)  → world (-X, -Z)   (menjauh dari kamera)
 *      Right (layar kanan) → world (+X, -Z)
 * =================================================================== */
const SCREEN_UP    = new THREE.Vector3(-1, 0, -1).normalize();
const SCREEN_RIGHT = new THREE.Vector3( 1, 0, -1).normalize();
const SPEED = 14;                                   // unit per detik

const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
addEventListener('keyup',   e => { keys[e.key.toLowerCase()] = false; });

const move = new THREE.Vector3();
function updateMovement(dt) {
  move.set(0, 0, 0);
  if (keys['w'] || keys['arrowup'])    move.add(SCREEN_UP);
  if (keys['s'] || keys['arrowdown'])  move.sub(SCREEN_UP);
  if (keys['d'] || keys['arrowright']) move.add(SCREEN_RIGHT);
  if (keys['a'] || keys['arrowleft'])  move.sub(SCREEN_RIGHT);

  if (move.lengthSq() > 0) {
    move.normalize();
    player.position.addScaledVector(move, SPEED * dt);
    // clamp di dalam map
    player.position.x = Math.max(-38, Math.min(38, player.position.x));
    player.position.z = Math.max(-38, Math.min(38, player.position.z));
    // hadapkan player ke arah gerak
    player.rotation.y = Math.atan2(move.x, move.z);
  }
  ring.position.x = player.position.x;
  ring.position.z = player.position.z;
}

/* =====================================================================
 * 7. RENDER LOOP
 * =================================================================== */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  updateMovement(dt);

  // bob ringan + pulse glow
  player.position.y = 1.1 + Math.sin(now * 0.005) * 0.08;
  ring.material.opacity = 0.4 + Math.sin(now * 0.004) * 0.2;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* =====================================================================
 * 8. RESIZE — recompute ortho frustum
 * =================================================================== */
addEventListener('resize', () => {
  const aspect = innerWidth / innerHeight;
  camera.left   = -FRUSTUM * aspect / 2;
  camera.right  =  FRUSTUM * aspect / 2;
  camera.top    =  FRUSTUM / 2;
  camera.bottom = -FRUSTUM / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
